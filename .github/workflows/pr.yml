name: PR

env:
  BUN_VERSION: canary

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  workflow_dispatch:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      sql: ${{ steps.filter.outputs.sql }}
      js_code: ${{ steps.filter.outputs.js_code }}
      frontend: ${{ steps.filter.outputs.frontend }}
      markdown: ${{ steps.filter.outputs.markdown }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
             - '**/*.go'
             - 'go.mod'
             - 'go.sum'
             - 'go.work'
             - 'server/**'
            sql:
             - '**/*.sql'
            js_code:
             - '**/*.?([cm])[jt]s'
             - '**/*.[jt]sx'
             - 'package.json'
             - 'bun.lock'
            frontend:
             - '**/*.css'
             - '**/*.svg'
             - '**/*.html'
             - '**/*.tmpl'
             - 'client/src/assets/swagger.yaml'
             - 'client/**'
             - 'scripts/**'
            markdown:
             - '**/*.md'
            native:
             - 'native/**'
             - 'mise.toml'
             - '.github/workflows/pr.yml'
             - '.github/workflows/release.yml'

  govulncheck:
    name: Vulnerabilities
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  bun-validation:
    name: Bun Validation
    needs: changes
    if: |
      github.event.pull_request.draft == false &&
      (needs.changes.outputs.js_code == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.markdown == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun lint && bun fmt --check

  native-validation:
    name: Native Client
    needs: changes
    if: |
      github.event.pull_request.draft == false &&
      (needs.changes.outputs.native == 'true' ||
       needs.changes.outputs.js_code == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
            kind: desktop
            artifact: dist/native-linux/**
          - target: windows
            runner: windows-latest
            kind: desktop
            artifact: dist/native-windows/**
          - target: macos
            runner: macos-latest
            kind: desktop
            artifact: dist/native-macos.app/**
          - target: android
            runner: ubuntu-latest
            kind: mobile
            artifact: dist/native-android.apk
          - target: ios
            runner: macos-latest
            kind: mobile
            artifact: dist/native-ios.ipa
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: Prepare package output directory
        shell: bash
        run: mkdir -p dist
      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        if: matrix.target == 'android'
        run: sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35" "ndk;27.2.12479018"
      - name: Install Linux WebView dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: bun install --frozen-lockfile
      - run: bun run native:check
      - name: Build desktop client
        if: matrix.kind == 'desktop'
        run: bun run native:build
      - name: Package Linux client
        if: matrix.target == 'linux'
        run: bun run native:package -- --target linux --output ../dist/native-linux
      - name: Package Windows client
        if: matrix.target == 'windows'
        run: bun run native:package -- --target windows --output ../dist/native-windows
      - name: Package macOS client
        if: matrix.target == 'macos'
        run: bun run native:package -- --target macos --signing none --output ../dist/native-macos.app
      - name: Package Android client
        if: matrix.target == 'android'
        run: bun run native:package -- --target android --output ../dist/native-android.apk
      - name: Package iOS client
        if: matrix.target == 'ios'
        run: bun run native:package -- --target ios --signing none --output ../dist/native-ios.ipa
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  fmt-go:
    name: Go Format
    needs: changes
    if: github.event.pull_request.draft == false && needs.changes.outputs.go == 'true'
    env:
      GOCACHE: ${{ github.workspace }}/dist/cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go fmt ./...
      - name: git diff
        run: git diff; git diff --quiet

  mod-go:
    name: Go Mod
    needs: changes
    if: github.event.pull_request.draft == false && needs.changes.outputs.go == 'true'
    env:
      GOCACHE: ${{ github.workspace }}/dist/cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: git diff
        run: git diff; git diff --quiet

  test-go:
    name: Go Test
    needs: changes
    if: |
      github.event.pull_request.draft == false &&
      (needs.changes.outputs.go == 'true' ||
       needs.changes.outputs.sql == 'true' ||
       needs.changes.outputs.js_code == 'true' ||
       needs.changes.outputs.frontend == 'true')
    env:
      GOCACHE: ${{ github.workspace }}/dist/cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun run front
      - run: go generate ./...
      - run: go test ./...

  build:
    name: Build
    needs:
      - changes
      - govulncheck
      - bun-validation
      - fmt-go
      - mod-go
      - test-go
    if: |
      always() &&
      !cancelled() &&
      github.event.pull_request.draft == false &&
      (needs.changes.outputs.go == 'true' ||
       needs.changes.outputs.sql == 'true' ||
       needs.changes.outputs.js_code == 'true' ||
       needs.changes.outputs.frontend == 'true') &&
      needs.govulncheck.result != 'failure' &&
      needs.govulncheck.result != 'cancelled' &&
      needs.bun-validation.result != 'failure' &&
      needs.bun-validation.result != 'cancelled' &&
      needs.fmt-go.result != 'failure' &&
      needs.fmt-go.result != 'cancelled' &&
      needs.mod-go.result != 'failure' &&
      needs.mod-go.result != 'cancelled' &&
      needs.test-go.result != 'failure' &&
      needs.test-go.result != 'cancelled'
    env:
      GOCACHE: ${{ github.workspace }}/dist/cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun run front
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bun run back:cross
      - run: bun run back:cross dev
      - name: Upload server binaries
        uses: nanoufo/action-upload-artifacts-and-release-assets@v2
        with:
          path: |
            dist/server-*
