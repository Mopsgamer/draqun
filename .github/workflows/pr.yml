name: PR

env:
  BUN_VERSION: canary

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  workflow_dispatch:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      sql: ${{ steps.filter.outputs.sql }}
      js_code: ${{ steps.filter.outputs.js_code }}
      frontend: ${{ steps.filter.outputs.frontend }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
             - '**/*.go'
             - 'go.mod'
             - 'go.sum'
             - 'go.work'
             - 'server/**'
            sql:
             - '**/*.sql'
            js_code:
             - '**/*.?([cm])[jt]s'
             - '**/*.[jt]sx'
             - 'package.json'
             - 'bun.lock'
            frontend:
             - '**/*.css'
             - '**/*.svg'
             - '**/*.html'
             - '**/*.tmpl'
             - 'client/src/assets/swagger.yaml'
             - 'client/**'
             - 'scripts/**'
            markdown:
             - '**/*.md'

  govulncheck:
    name: Vulnerabilities
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  bun-validation:
    name: Bun Validation
    needs: changes
    if: |
      github.event.pull_request.draft == false &&
      (needs.changes.outputs.js_code == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.markdown == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun lint && bun fmt --check

  fmt-go:
    name: Go Format
    needs: changes
    if: github.event.pull_request.draft == false && needs.changes.outputs.go == 'true'
    env:
      GOCACHE: ${{ github.workspace }}/dist/cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go fmt ./...
      - name: git diff
        run: git diff; git diff --quiet

  mod-go:
    name: Go Mod
    needs: changes
    if: github.event.pull_request.draft == false && needs.changes.outputs.go == 'true'
    env:
      GOCACHE: ${{ github.workspace }}/dist/cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: git diff
        run: git diff; git diff --quiet

  test-go:
    name: Go Test
    needs: changes
    if: |
      github.event.pull_request.draft == false &&
      (needs.changes.outputs.go == 'true' ||
       needs.changes.outputs.sql == 'true' ||
       needs.changes.outputs.js_code == 'true' ||
       needs.changes.outputs.frontend == 'true')
    env:
      GOCACHE: ${{ github.workspace }}/dist/cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun run front
      - run: go generate ./...
      - run: go test ./...

  build:
    name: Build
    needs:
      - changes
      - govulncheck
      - bun-validation
      - fmt-go
      - mod-go
      - test-go
    if: |
      always() &&
      !cancelled() &&
      github.event.pull_request.draft == false &&
      (needs.changes.outputs.go == 'true' ||
       needs.changes.outputs.sql == 'true' ||
       needs.changes.outputs.js_code == 'true' ||
       needs.changes.outputs.frontend == 'true') &&
      needs.govulncheck.result != 'failure' &&
      needs.govulncheck.result != 'cancelled' &&
      needs.bun-validation.result != 'failure' &&
      needs.bun-validation.result != 'cancelled' &&
      needs.fmt-go.result != 'failure' &&
      needs.fmt-go.result != 'cancelled' &&
      needs.mod-go.result != 'failure' &&
      needs.mod-go.result != 'cancelled' &&
      needs.test-go.result != 'failure' &&
      needs.test-go.result != 'cancelled'
    env:
      GOCACHE: ${{ github.workspace }}/dist/cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun run front
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bun run back:cross
      - run: bun run back:cross dev
      - name: Upload server binaries
        uses: nanoufo/action-upload-artifacts-and-release-assets@v2
        with:
          path: |
            dist/server-*
